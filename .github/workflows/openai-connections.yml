name: OpenAI bridge and connection UI
on:
  push:
    branches: [feature/chatgpt-openai-responses-bridge]
  pull_request:
    paths:
      - 'bridges/openai_responses.py'
      - 'bridges/siwc_auth.py'
      - 'scripts/login_chatgpt.py'
      - 'internal/server/connections*'
      - 'frontend/src/routes/connections/**'
      - 'frontend/src/lib/api.ts'
      - 'frontend/src/lib/route.ts'
      - 'frontend/src/lib/types.ts'
      - '.github/workflows/openai-connections.yml'

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyJWT[crypto]>=2.10,<3'
      - run: python -m unittest discover -s tests -p 'test*.py' -v
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./internal/server
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run check
        working-directory: frontend
